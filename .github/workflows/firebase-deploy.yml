# This file was auto-generated by the firebase-github-cd agent skill
name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Frontend (dist)
        run: npm run build
        env:
          VITE_PUBLIC_GEMINI_ACTIVE: 'true'
          VITE_PUBLIC_GEMINI_MASKED: 'AQ.A••••••••FSpQ'
          VITE_PUBLIC_SERPER_ACTIVE: 'true'
          VITE_PUBLIC_SERPER_MASKED: 'baf7••••••••693a'
          VITE_PUBLIC_APOLLO_ACTIVE: 'false'
          VITE_PUBLIC_RESEND_ACTIVE: 'false'

      - name: Desplegar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOGLITE_AGENCY }}
          channelId: live
          projectId: goglite-agency
          firebaseToolsVersion: 15.34.0

      - name: Desplegar Reglas de Firestore y Limpieza Cloud
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOGLITE_AGENCY }}' > /tmp/sa.json
          node scripts/deploy_rules_and_clean_cloud.mjs /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project goglite-agency || true
          rm -f /tmp/sa.json
